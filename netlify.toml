# Netlify Configuration for Yasraf Textiles SPA Storefront

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=optional"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Canonical Domain Enforcement (301 Permanent Redirects)
[[redirects]]
  from = "https://www.yasraftextiles.com/*"
  to = "https://yasraftextiles.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.yasraftextiles.com/*"
  to = "https://yasraftextiles.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://yasraftextiles.com/*"
  to = "https://yasraftextiles.com/:splat"
  status = 301
  force = true

# Function & API Route Rewrites (must precede SPA catch-all)
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track-order"
  status = 200

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single Page Application (SPA) routing rule
# Ensures direct links like /collections/ready-to-wear, /products/:slug, /about resolve to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# High-Performance Caching for Immutable Static Assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
