<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='serif' fill='%23121212'>Y</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YASRAF Clothing | Luxury Prêt & Women's Eastern Fashion</title>
    <meta name="description" content="YASRAF Clothing — Premium Pakistani women's ready-to-wear fashion, luxury prêt, bespoke lawn, and festive couture. Cash on Delivery available nationwide across Pakistan." />
    <meta name="keywords" content="YASRAF Clothing, Pakistani fashion, women prêt, luxury lawn, festive couture, ready to wear, party wear" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="YASRAF Clothing | Luxury Prêt & Women's Eastern Fashion" />
    <meta property="og:description" content="Discover exquisite Pakistani women's luxury prêt, embroidered suits, and ready-to-wear collections from YASRAF Clothing." />
    <meta property="og:site_name" content="YASRAF Clothing" />

    <!-- JSON-LD Structured Data for Fashion Brand & Store -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "YASRAF Clothing",
      "description": "Premium Pakistani women's ready-to-wear fashion and luxury prêt atelier.",
      "currenciesAccepted": "PKR, USD, AED, GBP, SAR",
      "priceRange": "Rs. 6,000 - Rs. 20,000",
      "paymentAccepted": "Cash on Delivery",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "PK"
      }
    }
    </script>
    
    <!-- Canonical URL for SEO -->
    <link rel="canonical" href="https://yasraf.com/" />

    <!-- High-Priority Preload for First-Screen Hero Image (AVIF) -->
    <link rel="preload" as="image" href="/hero-banner-mobile.avif" type="image/avif" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-banner-desktop.avif" type="image/avif" media="(min-width: 768px)" fetchpriority="high" />
    
    <!-- Google Fonts: Jost & Cormorant Garamond Non-Blocking Delivery -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&display=swap" rel="stylesheet">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
